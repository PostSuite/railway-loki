auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_concurrent_streams: 1000
  log_level: info
  log_format: json
  # Default for both is 30s. The write timeout caps how long Loki has to
  # finish writing a response — anything longer (e.g. cold 24h+ correlate
  # queries) gets cut off mid-stream regardless of upstream timeouts.
  # Match the nginx (`proxy_read_timeout 300s`) and Grafana
  # (`GF_DATAPROXY_TIMEOUT=300`) ceilings so the whole chain is consistent.
  http_server_read_timeout: 5m
  http_server_write_timeout: 5m

common:
  instance_addr: "::"
  path_prefix: /loki
  storage:
    # Default backend (Tigris — Railway's S3-compatible bucket service).
    # Non-blocking HTTP I/O so query parallelism doesn't pin OS threads the
    # way filesystem reads did. Credentials and endpoint resolved from
    # Railway env vars set on the Loki service ($S3_BUCKET, $S3_ENDPOINT,
    # $S3_ACCESS_KEY, $S3_SECRET_KEY) — all reference the "Loki Bucket"
    # plugin.
    s3:
      endpoint: ${S3_ENDPOINT}
      bucketnames: ${S3_BUCKET}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      region: auto
      s3forcepathstyle: true
      insecure: false
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  # Keep the filesystem backend declared too so the legacy schema entry
  # (chunks ingested before 2026-04-21) stays readable from
  # `/loki/chunks`. Removed from `common.storage` because S3 is now the
  # default for new writes; this `storage_config.filesystem` is referenced
  # only by the old schema entry. After ~2026-06-20 (60-day retention
  # rollover) this block can also be removed.
  filesystem:
    directory: /loki/chunks

query_range:
  # cache_results defaults to false, which means the embedded results_cache
  # below is allocated but never consulted. align_queries_with_step makes
  # near-identical dashboard queries hash to the same cache key instead of
  # missing because their step boundaries differ by milliseconds.
  cache_results: true
  align_queries_with_step: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Default is ~1GB. Was capped at 100MB which made eviction
        # aggressive on a workload with many distinct queries.
        max_size_mb: 1024

limits_config:
  # 60-day retention. Compactor below actually enforces it (the previous
  # value of 168h was set on limits_config but `compactor.retention_enabled`
  # was unset, so retention was advertised but never deleted anything).
  retention_period: 1440h
  max_entries_limit_per_query: 50000
  allow_structured_metadata: true
  discover_service_name: []
  # Query parallelism. The Loki container runs on 4 vCPU and was sitting
  # near-idle on CPU with ~8GB RAM used during cold queries — work was
  # serialized at querier.max_concurrent (see below). Smaller split
  # interval (default 30m → 10m) creates more sub-queries per range query
  # so the bumped concurrency is actually consumed.
  #
  # `tsdb_max_query_parallelism` temporarily back to Loki default (128)
  # while filesystem chunk reads still pin OS threads — combined with
  # max_concurrent: 16 below this caps peak parallel chunk readers at
  # ~2048 (vs the ~8192 that crashed at PR #6 settings). After the
  # 2026-04-21 schema cutover S3 takes over, chunk reads go non-blocking,
  # and we can revert this back to 256.
  split_queries_by_interval: 10m
  max_query_parallelism: 64           # default 32
  tsdb_max_query_parallelism: 128     # was 256; temporarily back to default
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service
            - environment
            - runtime
  # Suppress Loki's `detected_level` heuristic. With JSON bodies the
  # heuristic is irrelevant (we already have `severity_text` from OTel
  # which is authoritative), and on plain-text backend bodies it
  # mis-detects (any line containing the word "error" gets level=error
  # whether or not it's actually an error). One field per line saved
  # across all log streams.
  discover_log_levels: false
  reject_old_samples: false
  # Per-sub-query timeout (default 1m). With `split_queries_by_interval: 10m`
  # a 24h range becomes ~144 sub-queries fanned out in parallel; the default
  # 1m is enough for hot/cached chunks but a single cold 10m chunk on
  # filesystem storage can run longer. 3m gives headroom while staying well
  # under the 5m `http_server_write_timeout` ceiling above.
  query_timeout: 3m

schema_config:
  configs:
    # Old chunks live on the filesystem volume (`/loki/chunks`). They stay
    # readable from this schema entry until the 60-day retention window
    # rolls them out (~2026-06-20). After that the entry can be removed.
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
    # 2026-04-21 onward: new chunks AND TSDB indexes land in Tigris (S3).
    # Different `index.prefix` keeps the on-S3 index files separate from
    # the legacy on-disk ones, so the two backends don't collide.
    - from: 2026-04-21
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_s3_
        period: 24h

pattern_ingester:
  enabled: true

querier:
  # Default is 10. PR #6 set this to 32 to unblock cold-query performance,
  # but at 32 with filesystem chunk storage the runtime hits Go's OS-thread
  # cap (1024) within ~42h: each blocked syscall pins a goroutine to a
  # thread and they pile up faster than they retire.
  #
  # 16 is a compromise: 60% above Loki default for perf, 50% below the
  # value that crashed for safety (~2048 peak parallel chunk readers vs
  # ~8192 at the crashing setting). After the 2026-04-21 S3 cutover,
  # chunk reads become non-blocking HTTP and we can revert to 32 (or
  # higher).
  max_concurrent: 16

ingester:
  # Mobile log uploads arrive with capture-time timestamps that can lag
  # wall-clock by many hours when a device syncs late. The ingester's accept
  # window for out-of-order entries is max_chunk_age/2, so 48h gives a 24h
  # tolerance for delayed mobile sync — covers the worst observed rejection
  # (~19h stale) with headroom. Default is 2h (= 1h window). Memory cost is
  # negligible: chunks still flush on chunk_target_size (1.5 MB) and
  # chunk_idle_period (30m), so max_chunk_age only affects low-rate streams.
  max_chunk_age: 48h

ruler:
  # Pin ruler files to the filesystem volume explicitly. Was previously
  # inheriting from `common.storage.filesystem.rules_directory`; that
  # block went away when we switched the chunk default to S3, and the
  # ruler doesn't have its own S3 config here so we declare it locally.
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: http://localhost:9093

compactor:
  # Actually enforce `limits_config.retention_period`. Without this block
  # the compactor runs but never deletes — the previous 168h retention
  # setting was advertised but inert. `delete_request_store: s3` keeps
  # the compactor's own delete-tracking data on the same backend as new
  # chunks, so the filesystem volume stays read-only for legacy data.
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

frontend:
  encoding: protobuf

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
