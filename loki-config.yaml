auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_concurrent_streams: 1000
  log_level: info
  log_format: json

common:
  instance_addr: "::"
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  # cache_results defaults to false, which means the embedded results_cache
  # below is allocated but never consulted. align_queries_with_step makes
  # near-identical dashboard queries hash to the same cache key instead of
  # missing because their step boundaries differ by milliseconds.
  cache_results: true
  align_queries_with_step: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Default is ~1GB. Was capped at 100MB which made eviction
        # aggressive on a workload with many distinct queries.
        max_size_mb: 1024

limits_config:
  retention_period: 168h
  max_entries_limit_per_query: 50000
  allow_structured_metadata: true
  discover_service_name: []
  # Query parallelism. The Loki container runs on 4 vCPU and was sitting
  # near-idle on CPU with ~8GB RAM used during cold queries — work was
  # serialized at querier.max_concurrent (see below). Smaller split
  # interval (default 30m → 10m) creates more sub-queries per range query
  # so the bumped concurrency is actually consumed.
  split_queries_by_interval: 10m
  max_query_parallelism: 64           # default 32
  tsdb_max_query_parallelism: 256     # default 128
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service
            - environment
            - runtime
  # Suppress Loki's `detected_level` heuristic. With JSON bodies the
  # heuristic is irrelevant (we already have `severity_text` from OTel
  # which is authoritative), and on plain-text backend bodies it
  # mis-detects (any line containing the word "error" gets level=error
  # whether or not it's actually an error). One field per line saved
  # across all log streams.
  discover_log_levels: false
  reject_old_samples: false

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: true

querier:
  # Default is 10 concurrent sub-queries per querier process — this was the
  # binding bottleneck on cold queries: the frontend was splitting queries
  # into many shards that then queued waiting for a worker slot, leaving
  # CPU idle. frontend_worker.match_max_concurrent (default true since
  # Loki 2.5) makes this also raise the frontend→querier worker count.
  # 32 leaves headroom on the 4 vCPU box; raise to 64 if CPU still idle.
  max_concurrent: 32

ingester:
  # Mobile log uploads arrive with capture-time timestamps that can lag
  # wall-clock by many hours when a device syncs late. The ingester's accept
  # window for out-of-order entries is max_chunk_age/2, so 48h gives a 24h
  # tolerance for delayed mobile sync — covers the worst observed rejection
  # (~19h stale) with headroom. Default is 2h (= 1h window). Memory cost is
  # negligible: chunks still flush on chunk_target_size (1.5 MB) and
  # chunk_idle_period (30m), so max_chunk_age only affects low-rate streams.
  max_chunk_age: 48h

ruler:
  alertmanager_url: http://localhost:9093

frontend:
  encoding: protobuf

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
