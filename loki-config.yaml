auth_enabled: false

server:
  # Railway's internal DNS resolves loki.railway.internal to AAAA-only ULA
  # addresses (fd12::/16). Without `*_listen_address: "::"`, both HTTP and
  # gRPC listeners default to 0.0.0.0 (IPv4 wildcard) and peer SYNs to the
  # IPv6 ULA hang for 10s — the failure mode behind the OTLP-log exporter
  # ConnectTimeouts from fieldy-core-api. Dual-stacking is the matching
  # fix to the Tempo bind change (fuckme PR for tempo.yaml).
  http_listen_address: "::"
  grpc_listen_address: "::"
  http_listen_port: 3100
  grpc_listen_port: 9096
  grpc_server_max_concurrent_streams: 1000
  log_level: info
  log_format: json
  # Defaults are 30s/30s. The write timeout caps how long Loki has to finish
  # writing a response — anything longer (e.g. cold 24h+ correlate queries)
  # gets cut off mid-stream regardless of upstream timeouts. 15m gives
  # pre-S3-cutover wide-window queries (3d/7d) room to complete slowly under
  # reduced parallelism (see querier/limits below). Matches nginx and
  # Grafana ceilings (also bumped to 900s).
  http_server_read_timeout: 15m
  http_server_write_timeout: 15m

common:
  instance_addr: "::"
  path_prefix: /loki
  storage:
    # Default backend (Tigris — Railway's S3-compatible bucket service).
    # Migrated from the legacy `s3:` block to the Thanos objstore client
    # (`storage_config.use_thanos_objstore: true` below). Thanos defaults
    # max_idle_connections_per_host to 100 vs the legacy AWS SDK client
    # which inherits Go's http.Transport default of 2 — under concurrent
    # chunk GETs that meant constant TLS handshakes for connections past
    # the cap. Credentials/endpoint still resolved from Railway env vars
    # set on the Loki service ($S3_BUCKET, $S3_ENDPOINT, $S3_ACCESS_KEY,
    # $S3_SECRET_KEY) — all reference the "Loki Bucket" plugin.
    #
    # Key renames vs legacy:
    #   bucketnames           → bucket_name (Thanos supports only one bucket)
    #   s3forcepathstyle:true → bucket_lookup_type: path (Tigris is path-style)
    #   http_config           → http
    object_store:
      s3:
        endpoint: ${S3_ENDPOINT}
        bucket_name: ${S3_BUCKET}
        access_key_id: ${S3_ACCESS_KEY}
        secret_access_key: ${S3_SECRET_KEY}
        region: auto
        bucket_lookup_type: path
        insecure: false
        http:
          # Default is 1m30s. 5m keeps connections alive across consecutive
          # correlate sub-query batches in the same session. The Thanos
          # client defaults max_idle_connections / max_idle_connections_per_host
          # to 100, which fits our max_concurrent=64 querier budget — no
          # explicit override needed.
          idle_conn_timeout: 5m
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  # Opt into the Thanos objstore client (Loki 3.4+, will become default in a
  # future release). Replaces the legacy AWS SDK S3 client that has the
  # MaxIdleConnsPerHost=2 problem documented in the common.storage.object_store
  # block above. Same bucket, same objects, same chunk format — purely a
  # client library swap. Rollback is `git revert` + redeploy.
  use_thanos_objstore: true
  # Note on index caches: TSDB index does not use a server-side query cache
  # (`index_queries_cache_config`) — Loki docs explicitly state caching is not
  # required for TSDB. The TSDB shipper handles local disk caching via
  # `cache_location` (filesystem) and that path is sufficient. So we add a
  # chunk cache below but NOT an index cache.

# Embedded chunk cache REMOVED 2026-05-20 — the 8 GB embedded chunk cache
# added the previous day caused an OOM at 11:30 UTC. Mechanism: workers
# decompress ~250 MB chunks into heap, the cache copies for storage, then
# evicts an old entry. During a cold workload (cache full of unrelated
# chunks, e.g. AskFieldy correlate-user body grep sweeping through new
# chunks) every insert triple-buffers ~750 MB per slot. At 96 concurrent
# workers all doing this against a full cache, Go GC fell ~15 GB behind
# and the container blew past its 64 GB ceiling. Observed hit rate on
# the ad-hoc query workload that triggered the incident: 1.6% — chunk
# cache provides almost no value there.
#
# What we give up by removing it: dashboards do a first-paint S3 fetch
# instead of a memory hit (~50–200 ms slower). Auto-refresh and repeat
# queries are still served by `query_range.results_cache` below, which
# caches whole query results — a strictly bigger speedup than the
# chunk cache offered.
#
# Proper long-term fix is memcached as a separate Railway service so
# cache bytes live off the Loki heap. Out of scope for this PR.

query_range:
  # cache_results defaults to false, which means the embedded results_cache
  # below is allocated but never consulted. align_queries_with_step makes
  # near-identical dashboard queries hash to the same cache key instead of
  # missing because their step boundaries differ by milliseconds.
  cache_results: true
  align_queries_with_step: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Default is ~1GB. Was 100MB → 1024MB → 4096MB → 8192MB. 8GB cuts
        # cold sub-query rate on dashboard reloads. Cheap at 64GB container
        # size: today's 20-query 7d storm test peaked at 5GB query memory,
        # so query workload + 8GB cache + ~10GB baseline ≈ ~23GB total
        # under heavy load — comfortable inside the 64GB ceiling.
        max_size_mb: 8192

limits_config:
  # 60-day retention. Compactor below actually enforces it (the previous
  # value of 168h was set on limits_config but `compactor.retention_enabled`
  # was unset, so retention was advertised but never deleted anything).
  retention_period: 1440h
  max_entries_limit_per_query: 50000
  allow_structured_metadata: true
  discover_service_name: []
  # Per-query parallelism caps. These bound how many sub-queries one
  # query can fan out at the frontend; `querier.max_concurrent` below is
  # the global execution cap that ultimately gates how many run at once.
  #
  # 2026-05-20: the values these revert FROM (256 / 1024, set in PR #11)
  # let a single wide query monopolize all worker slots at the then-bumped
  # `max_concurrent: 128`. Combined with `max_concurrent` walking back to
  # 86 but these knobs staying at the bump, normal mixed dashboard +
  # correlate traffic was pushing committed memory past 54 GB and tripping
  # GOMEMLIMIT's GC brake (the "Loki chokes" symptom). Loki docs label
  # these as the per-request fan-out cap; restoring them to roughly
  # default × 2 sizing matches the resource footprint (64 GB / 32 vCPU
  # container).
  #
  # `max_query_parallelism: 64` — at our `max_concurrent: 64` (also
  # env-tunable below), one query CAN use every slot when nothing else is
  # competing → fast interactive correlate; with multi-query load the
  # global cap fair-shares between queries naturally.
  #
  # `tsdb_max_query_parallelism: 256` — purely a frontend dispatch cap;
  # the queue is KB-sized per sub-query, so 256 just lets a 7d query
  # queue all its sub-queries in fewer frontend rounds. No memory cost
  # because `max_concurrent` still gates execution.
  split_queries_by_interval: 10m
  max_query_parallelism: ${LOKI_MAX_QUERY_PARALLELISM}             # default 64
  tsdb_max_query_parallelism: ${LOKI_TSDB_MAX_QUERY_PARALLELISM}   # default 256
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service
            - environment
            - runtime
  # Backend services emit `severity_text` (OTel) and mobile logs emit
  # `level` as structured metadata. With explicit fields present, Loki's
  # field-priority match wins and the body-text heuristic never runs, so
  # the historical mis-detection concern does not apply. `detected_level`
  # is the canonical severity field for `fieldy-observe logs --level` and
  # for Grafana Logs panel coloring.
  discover_log_levels: true
  reject_old_samples: false
  # Per-sub-query timeout (default 1m). Acts as a hang detector — at
  # split=10m a healthy sub-query finishes in seconds; values >>1m mean a
  # stuck S3 fetch or ring partition. 5m gives slow but legitimate cold
  # sub-queries room to finish without prompting client retries (each
  # retry amplifies storm scenarios — see 2026-05-18 OOM incident).
  query_timeout: 5m

schema_config:
  configs:
    # All chunks and TSDB indexes live in Tigris (S3). Pre-2026-04-21
    # filesystem chunks were deleted along with the legacy schema entry —
    # queries against earlier time ranges return empty.
    - from: 2026-04-21
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_s3_
        period: 24h

pattern_ingester:
  enabled: true

querier:
  # Default 10; Loki docs recommend ~16 for TSDB single-binary on
  # standard hardware. History: 32 → 128 (#11, OOM) → 64 (#13) → 96
  # (#17) → 86 (#23) → 64 (this PR).
  #
  # Why 64 lands here: at 86 the storm and normal-but-concurrent
  # dashboard+correlate traffic was pushing committed heap past 54 GB
  # and tripping GOMEMLIMIT's GC brake. Workers held ~450-530 MB/slot
  # under realistic load (much higher than the original ~78 MB estimate
  # because of structured-metadata fetches). Math at 64:
  #
  #   workers       64 × ~450 MB ≈ 29 GB
  #   results_cache              ≈  8 GB
  #   baseline                   ≈  5 GB
  #   committed peak             ≈ 42 GB
  #   GC headroom in 64 GB       ≈ 22 GB
  #   GOMEMLIMIT (58 GiB ≈ 62 GB) margin ≈ 20 GB
  #
  # Sized at ~4× the Loki-recommended 16 because the container is ~4×
  # the typical single-binary recipe (64 GB / 32 vCPU vs the docs'
  # ~16 GB / 8 vCPU). Entrypoint defaults to 64 if
  # LOKI_QUERIER_MAX_CONCURRENT is unset.
  max_concurrent: ${LOKI_QUERIER_MAX_CONCURRENT}

ingester:
  # Mobile log uploads arrive with capture-time timestamps that can lag
  # wall-clock when a device syncs late. The ingester's accept window for
  # out-of-order entries is max_chunk_age/2, so 96h gives a 48h tolerance.
  # 2026-05-19: Prometheus scrape of loki revealed steady-state ~0.08 req/s
  # of 400 rejections from fieldy-mobile streams (single payloads with up
  # to 5000/5000 entries dropped) — the original "~19h worst observed"
  # estimate from this comment block has become stale; some payloads carry
  # entries from days to weeks ago. 96h catches overnight/weekend reconnects
  # which is the bulk of normal patterns; week-plus stragglers still miss.
  # Default is 2h (= 1h window). Memory cost remains negligible: chunks
  # flush on chunk_target_size (1.5 MB) and chunk_idle_period (30m), so
  # max_chunk_age only extends the upper bound for very-low-rate streams.
  max_chunk_age: 96h

ruler:
  # Pin ruler files to the filesystem volume explicitly. Was previously
  # inheriting from `common.storage.filesystem.rules_directory`; that
  # block went away when we switched the chunk default to S3, and the
  # ruler doesn't have its own S3 config here so we declare it locally.
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: http://localhost:9093

compactor:
  # Actually enforce `limits_config.retention_period`. Without this block
  # the compactor runs but never deletes — the previous 168h retention
  # setting was advertised but inert. `delete_request_store: s3` keeps
  # the compactor's own delete-tracking data on the same backend as new
  # chunks, so the filesystem volume stays read-only for legacy data.
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

frontend:
  encoding: protobuf
  # Default 2048. With max_query_parallelism=256 and tsdb_max_query_parallelism
  # =1024, a single 7d range query can fan out to 1008 sub-queries; several
  # concurrent wide-window queries can saturate the default queue and get
  # 429'd. Bumping to 8192 lets legitimate large queries queue without
  # rejection — queued sub-query state is KBs each, so memory cost is
  # negligible (8192 × ~KB ≈ ~10MB).
  max_outstanding_per_tenant: 8192

query_engine:
  # DISABLED again 2026-05-19. v2 engine in Loki 3.7 reads from dataobj
  # columnar storage — but the dataobj writer pipeline is part of the
  # new Kafka-backed ingestion architecture which single-binary Loki on
  # Railway does not run. Result: v2 reads from an incomplete/stale
  # dataobj store and returns truncated query results (observed cutoff
  # at ~13:07 local while real ingestion was current). Grafana panels
  # showed stale data with the banner "Query executed using the new
  # experimental query engine and dataobj storage".
  #
  # History on this knob:
  #   PR #15 (enable)  — opt-in, "falls back to legacy" claim;
  #   PR #18 (disable) — fixed 500s on NoopLabelFilter; caused 19× legacy
  #                      overload because dashboards had no-op `.*.*`
  #                      filters that legacy fully executed at ~414MB
  #                      structured metadata per sub-query;
  #   PR #19 (enable)  — emergency revert of #18 to stop the overload;
  #   THIS PR (disable) — safe now that the offending dashboard panels
  #                       have been cleaned up (no more `.*.*` regex
  #                       filters), so legacy executing these queries
  #                       is no longer catastrophic. Correctness >>
  #                       the ~5-15% speed cost.
  #
  # Re-enable only when Loki ships a single-binary-compatible dataobj
  # writer, OR when we move to the Kafka-backed ingestion architecture.
  enable: false

# By default, Loki will send anonymous, but uniquely-identifiable usage and configuration
# analytics to Grafana Labs. These statistics are sent to https://stats.grafana.org/
#
# Statistics help us better understand how Loki is used, and they show us performance
# levels for most users. This helps us prioritize features and documentation.
# For more information on what's sent, look at
# https://github.com/grafana/loki/blob/main/pkg/analytics/stats.go
# Refer to the buildReport method to see what goes into a report.
#
# If you would like to disable reporting, uncomment the following lines:
#analytics:
#  reporting_enabled: false
